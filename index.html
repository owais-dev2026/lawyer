/* يبدأ التطبيق بالوضع العمودي. يمكن للمستخدم تبديل الاتجاه يدوياً من الإعدادات. */
(function(){
  const KEY='lawyerAgendaOrientation';
  let desired='portrait';
  try { desired=localStorage.getItem(KEY)==='landscape'?'landscape':'portrait'; } catch(_) {}
  window.setAgendaOrientation=async function(mode,notify=true){
    desired=mode==='landscape'?'landscape':'portrait';
    try { localStorage.setItem(KEY,desired); } catch(_) {}
    try {
      if(screen.orientation && typeof screen.orientation.lock==='function'){
        await screen.orientation.lock(desired);
        if(notify && typeof window.toast==='function') window.toast(desired==='portrait'?'تم تثبيت الوضع العمودي':'تم تدوير التطبيق إلى الوضع الأفقي');
        return true;
      }
    } catch(_) {}
    if(notify && typeof window.toast==='function') window.toast('هذا الجهاز لا يسمح بتغيير اتجاه الشاشة من داخل الصفحة. يلزم ضبط اتجاه تطبيق Android نفسه.');
    return false;
  };
  window.addEventListener('load',()=>window.setAgendaOrientation(desired,false),{once:true});
  document.addEventListener('fullscreenchange',()=>window.setAgendaOrientation(desired,false));
})();
</script>

<style>
:root{color-scheme:light;--bg:#f5f6f8;--card:#ffffff;--ink:#101a36;--mut:#667085;--line:#e1e4ea;--pri:#010f40;--prifg:#ffffff;--acc:#d7a22e;--accfg:#010f40;--accbg:rgba(215,162,46,.16);--sec:#eef1f5;--red:oklch(.52 .18 28);--redbg:oklch(.52 .18 28/.1);--ok:oklch(.52 .1 150);--side:#010f40;--sidefg:#ffffff;--sidepri:#d7a22e;--sideacc:#0b1a50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic","Arabic Typesetting",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,.sf{font-family:Georgia,"Times New Roman","Amiri",serif}h1{font-size:26px;color:var(--pri);margin:0 0 2px;line-height:1.3}h2{font-size:17px;font-family:inherit;color:var(--pri);margin:22px 0 10px;padding-inline-start:10px;border-inline-start:4px solid var(--acc);line-height:1.2}
#shell{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg)}.mc{min-width:0}body{background:#eef0f4}
main{padding:16px 14px 96px}
#top{position:sticky;top:0;z-index:4;height:60px;background:var(--side);color:var(--sidefg);display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 2px 6px #0002;border-bottom:2px solid var(--acc)}#top button{color:var(--sidefg)}
.brand{display:flex;gap:10px;align-items:center}.brand b{display:block;font:700 18px "Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.2}
.ic{width:40px;height:40px;border-radius:0;background:transparent;box-shadow:none;display:grid;place-items:center;color:var(--sidepri)}
.logoBox{overflow:visible;background:transparent;border:0;outline:0;box-shadow:none;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0}.logoBox img{width:44px;height:44px;object-fit:contain;display:block;background:transparent;border:0;border-radius:50%}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500}
.btn.p{background:var(--pri);border-color:var(--pri);color:var(--prifg)}.btn.a{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.btn.s{min-height:34px;padding:0 12px;font-size:14px;border-radius:8px}.btn.d{color:var(--red)}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.mic{min-width:44px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.mic.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}textarea{min-height:90px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px 14px 14px;margin-bottom:10px;box-shadow:0 1px 2px #0001;overflow:hidden}
.card:before{content:"";position:absolute;inset-block:0;right:0;width:4px;background:var(--acc)}
.card.red:before{background:var(--red)}.card.ok:before{background:var(--ok)}.card.ok{background:#f0f2f5}.card.ok h3{text-decoration:line-through;color:var(--mut)}.card.amb:before{background:var(--acc)}
.card h3{font-size:16px;margin:0}.m{color:var(--mut);font-size:14px}
.tb{flex:none;width:68px;text-align:center;background:var(--sec);border-radius:8px;padding:8px 2px;font-weight:700;font-size:13px;color:var(--pri)}.tb small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--accbg);color:var(--accfg);white-space:nowrap}.tag.red{background:var(--redbg);color:var(--red)}.tag.amb{background:var(--accbg);color:var(--accfg)}
.chk{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid rgba(1,15,64,.4);background:var(--bg);color:#fff;font-size:18px;cursor:pointer;line-height:1}.chk.on{background:var(--ok);border-color:var(--ok)}
.bar{height:8px;border-radius:9px;background:var(--sec);overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--ok)}
.alert{border-radius:12px;padding:10px 14px;margin-bottom:10px;font-weight:500;border:1px solid}.alert.red{background:var(--redbg);color:var(--red);border-color:oklch(.52 .18 28/.35)}.alert.amb{background:var(--accbg);color:var(--accfg);border-color:var(--acc)}
.hero{background:var(--pri);color:var(--prifg);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 20px #0003;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;left:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:18px solid rgba(215,162,46,.15)}
.hero h1{color:inherit;font-size:28px;font-weight:700;letter-spacing:-0.02em;line-height:1.35;font-family:Georgia,"Times New Roman",serif}.hero p{margin:0;opacity:.7;font-size:14px}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.st b{display:block;font-size:30px;color:var(--pri);line-height:1.2}.st span{font-size:13px;color:var(--mut)}
.scan-box{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:18px;margin-bottom:10px}
.scan-box h3{margin:0 0 8px;font-size:15px;color:var(--pri)}
.scan-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.scan-thumbs .th{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#eee}
.scan-thumbs .th img{width:100%;height:100%;object-fit:cover}
.scan-thumbs .th button{position:absolute;top:2px;left:2px;width:22px;height:22px;border:0;border-radius:50%;background:var(--red);color:#fff;font-size:12px;cursor:pointer;line-height:1;padding:0}
.toast{position:fixed;bottom:80px;inset-inline:14px;max-width:492px;margin:0 auto;z-index:15;background:var(--side);color:var(--sidefg);padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px #0005;font-size:14px;display:none}
.toast.show{display:block;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

nav#nav{position:fixed;inset-inline:0;bottom:0;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);background:var(--side);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{min-width:0;border:0;background:none;min-height:60px;font-size:11px;color:var(--sidefg);opacity:.6;cursor:pointer;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}#nav button svg{display:block}

let firebaseLoadPromise=null;
function loadExternalScript(src){
  return new Promise((resolve,reject)=>{
    const existing=[...document.scripts].find(x=>x.src===src);
    if(existing){
      if(existing.dataset.loaded==='1'){resolve();return}
      existing.addEventListener('load',()=>resolve(),{once:true});
      existing.addEventListener('error',()=>reject(new Error('تعذّر تحميل مكتبة Firebase')),{once:true});
      return;
    }
    const script=document.createElement('script');
    script.src=src;script.async=true;
    script.onload=()=>{script.dataset.loaded='1';resolve()};
    script.onerror=()=>{script.remove();reject(new Error('تعذّر تحميل مكتبة Firebase'))};
    document.head.appendChild(script);
  });
}
async function ensureFirebase(){
  if(fbDb)return fbDb;
  if(!/^https?:$/.test(location.protocol))return null;
  if(!firebaseLoadPromise){
    firebaseLoadPromise=(async()=>{
      await loadExternalScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
      await loadExternalScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js');
      if(typeof firebase==='undefined')throw new Error('Firebase غير متاح');
      fbApp=firebase.apps&&firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
      fbDb=firebase.firestore();
      return fbDb;
    })().catch(err=>{firebaseLoadPromise=null;console.warn('Firebase init failed',err);return null});
  }
  return firebaseLoadPromise;
}

/** معرّف ثابت للجهاز/المستخدم مبني على salt كلمة المرور — لا يُرسل نص البيانات أبداً */
function cloudDocId(){
  try{
    const s=(Auth&&Auth.salt)||'anon';
    let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}
    return 'u_'+Math.abs(h).toString(36)+'_'+s.slice(0,12).replace(/[^a-zA-Z0-9]/g,'');
  }catch(e){return 'u_anon'}
}

async function cloudPush(pack,showMsg){
  if(!fbDb)await ensureFirebase();
  if(!fbDb){if(showMsg)toast('تعذّر الاتصال بـ Firebase — تأكد من الإنترنت وافتح التطبيق عبر https');return false;}
  if(!cloudSyncEnabled){if(showMsg)toast('المزامنة السحابية معطّلة');return false;}
  if(!unlocked||!cryptoKey){if(showMsg)toast('افتح القفل أولاً');return false;}
  try{
    const id=cloudDocId();
    await fbDb.collection('agendas').doc(id).set({
      pack,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      v:2,
      app:'lawyer-agenda'
    },{merge:true});
    lastCloudSync=Date.now();
    if(showMsg)toast('✓ تمت المزامنة السحابية');
    return true;
  }catch(e){
    console.warn('cloudPush',e);
    const msg=(e&&(e.code||e.message))||String(e);
    if(showMsg||true)toast('فشل السحابة: '+msg);
    return false;
  }
}

/** مزامنة يدوية: تشفير ثم رفع */
async function syncNow(){
  if(!cryptoKey||!unlocked){toast('افتح القفل أولاً');return;}
  if(!loadOk){toast('البيانات لم تُحمَّل بعد');return;}
  if(!fbDb)await ensureFirebase();
  if(!fbDb){toast('تعذّر الاتصال بـ Firebase — تأكد من الإنترنت وقواعد Firestore');return;}
  try{
    const pack=await encryptData(D,cryptoKey);
    localStorage.setItem(K,JSON.stringify(pack));
    const ok=await cloudPush(pack,true);
    if(!ok)return;
  }catch(e){toast('فشل المزامنة: '+(e&&e.message||e))}
}

async function cloudPull(){
  if(!cloudSyncEnabled||!cryptoKey)return null;
  if(!fbDb)await ensureFirebase();
  if(!fbDb)return null;
  try{
    const id=cloudDocId();
    const snap=await fbDb.collection('agendas').doc(id).get();
    if(snap.exists){const d=snap.data();if(d&&d.pack&&d.pack.ct)return d.pack}
  }catch(e){console.warn('cloudPull',e)}
  return null;
}

let D={tasks:[],deadlines:[],reminders:[],sessions:[],clients:[],scans:[],casePdfs:{},casePages:{}};

let cryptoKey=null,unlocked=false,plainPass='',loadOk=false;

  const o=BLANK();if(!d||typeof d!=='object')return o;
  ['tasks','deadlines','reminders','sessions','clients'].forEach(k=>{if(Array.isArray(d[k]))o[k]=d[k].filter(x=>x&&typeof x==='object'&&typeof x.id==='string')});

  return o;
}

/* ---- أمان: تشفير AES-GCM بكلمة المرور ---- */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return (h>>>0).toString(36)+s.length}
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function fromB64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
const ITER=310000;
async function deriveKey(pass,saltB64,iter){
  const it=iter||(saltB64?(Auth.iter||120000):ITER);
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveKey']);
  const salt=saltB64?fromB64(saltB64):crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt instanceof ArrayBuffer?new Uint8Array(salt):salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  return{key,saltB64:saltB64||b64(salt)};
}
async function encryptData(obj,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const enc=new TextEncoder();
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return{v:1,iv:b64(iv),ct:b64(ct)};
}
async function decryptData(pack,key){
  const dec=new TextDecoder();
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(fromB64(pack.iv))},key,fromB64(pack.ct));
  return JSON.parse(dec.decode(pt));
}
async function save(){
  try{
    // حماية من أي مسار يحاول حفظ بيانات القضايا كنص واضح.
    // لا نحفظ شيئاً قبل إنشاء/التحقق من مفتاح التشفير ونجاح تحميل البيانات.
    if(!cryptoKey || !unlocked) { toast('لم يتم الحفظ: افتح القفل أولاً'); return false; }
    if(!loadOk){toast('لم يتم الحفظ لأن قراءة البيانات لم تكتمل');return false;}
    const pack=await encryptData(D,cryptoKey);
    localStorage.setItem(K,JSON.stringify(pack));
    // مزامنة سحابية للنسخة المشفّرة فقط (لا تُرسل بيانات واضحة)
    cloudPush(pack).catch(()=>{});
    return true;
  }catch(e){toast('تعذّر حفظ البيانات المشفّرة');return false}
}
const saveAuth=()=>{try{localStorage.setItem(AUTH,JSON.stringify(Auth))}catch(e){}};
const mkChk=key=>encryptData({ok:1},key);
async function verifyPass(p){
  try{
    const{key}=await deriveKey(p,Auth.salt);
    if(Auth.chk){await decryptData(Auth.chk,key);return key}
    if(hash(p)!==Auth.pass)return null; // حسابات قديمة: تحقق مرة واحدة ثم نرقّيها
    Auth.chk=await mkChk(key);Auth.pass='1';saveAuth();return key;
  }catch(e){return null}
}
async function loadData(){
  loadOk=false;
  try{
    let pack=null;
    const raw=localStorage.getItem(K);
    if(raw){
      try{pack=JSON.parse(raw)}catch(e){pack=null}
    }
    if(pack&&pack.plain){D=BLANK();loadOk=false;toast('تم حظر بيانات قديمة غير مشفّرة. لا تحفظ فوقها؛ صدّر/استعد نسخة آمنة بعد مراجعة البيانات.');return}
    // إن لم توجد بيانات محلية: حاول السحب من السحابة
    if((!pack||!pack.ct)&&cryptoKey){
      const remote=await cloudPull();
      if(remote&&remote.ct){
        pack=remote;
        try{localStorage.setItem(K,JSON.stringify(pack))}catch(e){}
      }
    }
    if(!pack||!pack.ct){D=BLANK();loadOk=true;return}
    if(cryptoKey&&pack.ct){D=normalizeData(await decryptData(pack,cryptoKey));loadOk=true}
  }catch(e){console.warn(e)}
}
async function rekey(p){ // تغيير المفتاح بشكل متزامن: لا نترك البيانات ببيانات مصادقة قديمة
  const{key,saltB64}=await deriveKey(p,null,ITER);

  localStorage.setItem(K,JSON.stringify(pack));
  Auth.salt=saltB64;Auth.iter=ITER;Auth.pass='1';Auth.chk=chk;saveAuth();
  cryptoKey=key;plainPass=p;
  cloudPush(pack).catch(()=>{});
}

  const np=()=>{c=document.createElement('canvas');c.width=W;c.height=H;x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#222';x.direction='rtl';x.textAlign='right';y=M;pages.push(c)};

async function restoreFile(f){
  const im=$('#im');const say=m=>{if(im)im.textContent=m;toast(m,4500)};
  try{
    let j;
    if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
      const txt=new TextDecoder('latin1').decode(await f.arrayBuffer());
      const a=txt.indexOf(BK_B),b=txt.indexOf(BK_E,a);
      if(a<0||b<0){say('هذا الملف ليس نسخة احتياطية من التطبيق (أو أُعيد حفظه من برنامج آخر)');return}
      j=JSON.parse(txt.slice(a+BK_B.length,b));
    }else j=JSON.parse(await f.text());
    let data;
    if(j&&j.v===2&&j.pack&&j.salt){
      const pw=await askPass('كلمة مرور النسخة','أدخل كلمة المرور التي كانت مستخدمة وقت أخذ هذه النسخة.');
      if(pw===null)return;
      const{key}=await deriveKey(pw,j.salt,+j.iter||120000);
      try{data=await decryptData(j.pack,key)}catch(e){say('كلمة المرور غير صحيحة أو الملف تالف');return}
    }else if(j&&j.plain&&j.data){say('تم رفض النسخة لأنها غير مشفّرة. لن يتم تحميل بيانات حساسة من ملف مكشوف.');return}
    else if(j&&j.ct&&j.iv){
      try{data=await decryptData(j,cryptoKey)}catch(e){say('هذه نسخة JSON قديمة ولا تُفتح إلا على نفس الجهاز بنفس كلمة المرور. أنشئ نسخة PDF جديدة.');return}
    }else{say('ملف غير صالح');return}
    const nd=normalizeData(data);
    if(!confirm('سيتم استبدال البيانات الحالية ببيانات النسخة ('+nd.sessions.length+' جلسة، '+nd.deadlines.length+' موعد طعن، '+nd.tasks.length+' مهمة). متابعة؟'))return;
    D=nd;loadOk=true;await save();draw();
    say('تمت الاستعادة بنجاح');
  }catch(e){console.warn(e);say('ملف غير صالح')}
}

async function writeCasePdf(itemId,blob,fileName){

        });

      }
      const w=await handle.createWritable();
      await w.write(blob);
      await w.close();
      return true;
    }catch(e){

      // سقوط للتنزيل العادي
    }
  }
  // تنزيل باسم ثابت (المستخدم يستبدل يدوياً إن لزم)
  const url=URL.createObjectURL(blob);

function compressImage(file,maxW,quality){
  maxW=maxW||2800;quality=quality==null?0.92:quality;
  return new Promise(async(res,rej)=>{
    try{
      // createImageBitmap أسرع وأوضح من Image+FileReader
      if(typeof createImageBitmap==='function'&&(file instanceof Blob)){
        const bmp=await createImageBitmap(file);
        let w=bmp.width,h=bmp.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');
        ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
        ctx.drawImage(bmp,0,0,w,h);
        try{bmp.close&&bmp.close()}catch(e){}
        res(c.toDataURL('image/jpeg',quality));
        return;
      }
    }catch(e){}
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');
        ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
        ctx.drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=rej;
      img.src=r.result;
    };
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
/* توليد PDF بسيط يضم صوراً (بدون مكتبات خارجية) */
function jpegToPdf(images,title){
  // كل صورة = صفحة؛ PDF يدوي مبسّط لـ JPEG
  const pages=[];
  const encoder=new TextEncoder();
  function str(s){return s}
  let objs=[],xref=[],body='',o=1;
  function addObj(content){
    const off=body.length;
    xref.push(off);
    body+=`${o} 0 obj\n${content}\nendobj\n`;
    return o++;
  }
  // Catalog + Pages later
  const imgIds=[],pageIds=[];
  for(const src of images){
    const b64s=src.replace(/^data:image\/jpeg;base64,/,'').replace(/^data:image\/jpg;base64,/,'');
    // decode base64 to binary string for length
    const bin=atob(b64s);
    // Get dimensions roughly from JPEG SOF — default A4-ish
    let w=595,h=842;
    try{
      const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      for(let i=0;i<u.length-9;i++){
        if(u[i]===0xFF&&(u[i+1]===0xC0||u[i+1]===0xC2)){
          h=(u[i+5]<<8)|u[i+6];w=(u[i+7]<<8)|u[i+8];break;
        }
      }
    }catch(e){}
    // scale to fit A4 595x842
    const maxW=555,maxH=800;
    let dw=w,dh=h;
    const sc=Math.min(maxW/w,maxH/h,1);
    dw=Math.round(w*sc);dh=Math.round(h*sc);
    const x=Math.round((595-dw)/2),y=Math.round((842-dh)/2);
    const imgObj=addObj(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n${bin}\nendstream`);
    imgIds.push(imgObj);
    const cont=addObj(`<< /Length ${`q ${dw} 0 0 ${dh} ${x} ${y} cm /Im${imgObj} Do Q`.length} >>\nstream\nq ${dw} 0 0 ${dh} ${x} ${y} cm /Im${imgObj} Do Q\nendstream`);
    const page=addObj(`<< /Type /Page /Parent PAGES /MediaBox [0 0 595 842] /Contents ${cont} 0 R /Resources << /XObject << /Im${imgObj} ${imgObj} 0 R >> >> >>`);
    pageIds.push(page);
  }
  const pagesObj=o;
  body+=`${o} 0 obj\n<< /Type /Pages /Kids [${pageIds.map(id=>id+' 0 R').join(' ')}] /Count ${pageIds.length} >>\nendobj\n`;
  xref.push(body.length-(body.split('\n').slice(-3).join('\n').length)); // rough, fix below
  // rebuild properly
  return buildPdf(images,title);
}

async function ensureJpeg(dataUrl){
  if(typeof dataUrl==='string'&&/^data:image\/(jpeg|jpg)/i.test(dataUrl))return dataUrl;
  return await new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement('canvas');
        c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;
        const ctx=c.getContext('2d');ctx.drawImage(img,0,0);
        res(c.toDataURL('image/jpeg',0.92));
      }catch(e){rej(e)}
    };
    img.onerror=()=>rej(new Error('صورة تالفة'));
    img.src=dataUrl;
  });
}

function buildPdf(images,title,extra){
  const enc=str=>{const a=new Uint8Array(str.length);for(let i=0;i<str.length;i++)a[i]=str.charCodeAt(i)&0xff;return a};
  const parts=[];let pos=0;const offsets={0:0};
  const addBytes=u8=>{parts.push(u8);pos+=u8.length};
  const addStr=str=>addBytes(enc(str));
  const startObj=n=>{offsets[n]=pos;addStr(n+' 0 obj\n')};
  const endObj=()=>{addStr('endobj\n')};

  const imgs=[];
  for(let i=0;i<images.length;i++){
    let src=images[i];if(!src||typeof src!=='string')continue;
    let b64=src;if(b64.indexOf(',')>=0)b64=b64.split(',')[1];
    b64=b64.replace(/\s/g,'');
    let u;try{const bin=atob(b64);u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j)}catch(e){continue}
    if(u.length<4||u[0]!==0xFF||u[1]!==0xD8)continue;
    let w=595,h=842;
    for(let j=0;j<Math.min(u.length-9,200000);j++){
      if(u[j]===0xFF&&(u[j+1]===0xC0||u[j+1]===0xC1||u[j+1]===0xC2)){
        h=(u[j+5]<<8)|u[j+6];w=(u[j+7]<<8)|u[j+8];break;
      }
    }
    if(!w||!h){w=595;h=842}
    imgs.push({u,w,h});
  }
  if(!imgs.length)throw new Error('لا توجد صور JPEG صالحة');

  addStr('%PDF-1.4\n');
  startObj(1);addStr('<< /Type /Catalog /Pages 2 0 R >>\n');endObj();

  let next=3;const pageIds=[];const prepared=[];
  for(let i=0;i<imgs.length;i++){
    const imgId=next++,contId=next++,pageId=next++;
    pageIds.push(pageId);
    const im=imgs[i];
    const maxW=555,maxH=800;
    const sc=Math.min(maxW/im.w,maxH/im.h,1);
    const dw=Math.max(1,Math.round(im.w*sc)),dh=Math.max(1,Math.round(im.h*sc));
    const x=Math.round((595-dw)/2),y=Math.round((842-dh)/2);
    prepared.push({imgId,contId,pageId,u:im.u,w:im.w,h:im.h,dw,dh,x,y});
  }

  startObj(2);
  addStr('<< /Type /Pages /Kids ['+pageIds.map(id=>id+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>\n');
  endObj();

  for(let i=0;i<prepared.length;i++){
    const im=prepared[i];
    startObj(im.imgId);
    addStr('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.u.length+' >>\nstream\n');
    addBytes(im.u);
    addStr('\nendstream\n');
    endObj();
    const ops='q '+im.dw+' 0 0 '+im.dh+' '+im.x+' '+im.y+' cm /Im0 Do Q\n';
    startObj(im.contId);
    addStr('<< /Length '+ops.length+' >>\nstream\n'+ops+'endstream\n');
    endObj();
    startObj(im.pageId);
    addStr('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents '+im.contId+' 0 R /Resources << /XObject << /Im0 '+im.imgId+' 0 R >> >> >>\n');
    endObj();
  }

  if(extra){
    const ex=enc(String(extra));
    startObj(next);
    addStr('<< /Length '+ex.length+' >>\nstream\n');
    addBytes(ex);
    addStr('\nendstream\n');
    endObj();
    next++;
  }

  const xrefStart=pos;
  addStr('xref\n');
  addStr('0 '+next+'\n');
  addStr('0000000000 65535 f \n');
  for(let i=1;i<next;i++){
    addStr(String(offsets[i]||0).padStart(10,'0')+' 00000 n \n');
  }
  addStr('trailer\n<< /Size '+next+' /Root 1 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF\n');

  const total=parts.reduce((a,c)=>a+c.length,0);
  const out=new Uint8Array(total);
  let o=0;for(let i=0;i<parts.length;i++){out.set(parts[i],o);o+=parts[i].length}
  return new Blob([out],{type:'application/pdf'});
}

document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-a],[data-tab]');if(!el)return;
 if(el.dataset.tab){e.preventDefault();document.querySelector('.ov')?.remove();stopVoice();tab=el.dataset.tab;draw();scrollTo(0,0);return}
 const{a,t,id}=el.dataset;e.preventDefault();
 if(a==='rotate-toggle'){
   let current='portrait';try{current=localStorage.getItem('lawyerAgendaOrientation')==='landscape'?'landscape':'portrait'}catch(_){}
   await window.setAgendaOrientation(current==='portrait'?'landscape':'portrait',true);
   return;
 }
 if(a==='more'){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="mod"><h2 style="margin-top:0">المزيد</h2>${TABS.slice(5).map(([k,l,,i])=>`<button class="mn" data-tab="${k}">${I(i)}${l}</button>`).join('')}</div>`;ov.onclick=e=>{if(e.target===ov)ov.remove()};document.body.appendChild(ov)}
 else if(a==='new')openForm(t);
 else if(a==='ed')openForm(t,id);
 else if(a==='tg'){const x=D[t].find(i=>i.id===id);x.done=!x.done;await save();draw()}
 else if(a==='dl'){if(!el.dataset.s){el.dataset.s=1;el.textContent='تأكيد الحذف؟';setTimeout(()=>{el.dataset.s='';el.textContent='حذف'},3000);return}D[t]=D[t].filter(i=>i.id!==id);await save();draw()}
 else if(a==='day'){cur=+el.dataset.n?add(cur,+el.dataset.n):today();draw()}
 else if(a==='notif'){Notification.requestPermission().then(p=>{try{if(p==='granted')localStorage.setItem('lawyerNotif','1')}catch(e){}draw()})}
 else if(a==='pdf')printAll();
 else if(a==='syncnow')await syncNow();
 else if(a==='bkpdf'||a==='bkpdfr')await backupPdf(a==='bkpdfr');
 else if(a==='imp'||a==='impfile'){
   const inp=$('#impFile');if(!inp){toast('أعد فتح الإعدادات');return}
   inp.value='';
   inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(f)await restoreFile(f)};
   inp.click();
 }
 else if(a==='scan')openCamera(el.dataset.sec);
 else if(a==='scanpdf')exportScansPdf(el.dataset.sec);
 else if(a==='formscan')openCamera(el.dataset.sec,el.dataset.item);
 else if(a==='formscanpdf')exportItemScansPdf(el.dataset.sec,el.dataset.item);
 else if(a==='opencasepdf')openCasePdf(el.dataset.item);
 else if(a==='scandel'){
   D.scans=(D.scans||[]).filter(s=>s.id!==id);await save();
   const th=el.closest('.th');if(th)th.remove();else draw();
 }
 else if(a==='chpass'){
   const cur=$('#cpw').value,n=$('#npw').value,n2=$('#npw2').value;
   if(!(await verifyPass(cur))){$('#cpe').textContent='كلمة المرور الحالية خاطئة';return}
   if(n.length<8){$('#cpe').textContent='الجديدة 8 أحرف على الأقل';return}
   if(n!==n2){$('#cpe').textContent='غير متطابقتين';return}
   try{
     await rekey(n);
     $('#cpe').style.color='var(--ok)';$('#cpe').textContent='تم التغيير وإعادة التشفير.';
     $('#cpw').value=$('#npw').value=$('#npw2').value='';
   }catch(err){$('#cpe').textContent='فشل إعادة التشفير'}
 }
});
document.addEventListener('submit',async e=>{if(e.target.id==='qa'){e.preventDefault();const v=$('#qt').value.trim();if(!v)return;D.tasks.push({id:uid(),title:v,notes:'',date:cur,done:false,roll:0});await save();draw();$('#qt').focus()}});

function printAll(){
 const T=(h,rows,f)=>rows.length?`<h2>${h}</h2><table><tr>${f.map(x=>'<th>'+x[0]+'</th>').join('')}</tr>${rows.map(r=>'<tr>'+f.map(x=>'<td>'+esc(x[1](r))+'</td>').join('')+'</tr>').join('')}</table>`:'';
 const st=r=>r.done?'منجز':'قيد المتابعة';
 $('#pr').innerHTML=`<h1>أجندة المحامي المتكاملة — نسخة احتياطية</h1><p>${new Date().toLocaleString('ar-u-nu-latn')}</p>`
 +T('مواعيد الطعن',[...D.deadlines].sort((a,b)=>a.due.localeCompare(b.due)),[['النوع',r=>r.kind],['الإجراء',r=>r.title],['الموكل',r=>r.client],['القضية',r=>r.case],['آخر موعد',r=>r.due],['الحالة',st],['ملاحظات',r=>r.notes]])
 +T('الجلسات',[...D.sessions].sort((a,b)=>a.date.localeCompare(b.date)),[['الموكل',r=>r.client],['القضية',r=>r.case],['المحكمة',r=>r.court],['التاريخ',r=>r.date],['الوقت',r=>r.time],['الحالة',st],['ملاحظات',r=>r.notes]])
 +T('التذكيرات',[...D.reminders].sort((a,b)=>evt(a)-evt(b)),[['الموعد',r=>r.title],['التاريخ',r=>r.date],['الوقت',r=>r.time],['الحالة',st]])
 +T('المهام',[...D.tasks].sort((a,b)=>a.date.localeCompare(b.date)),[['اليوم',r=>r.date],['المهمة',r=>r.title],['الحالة',r=>r.done?'منجزة':'غير منجزة']]);
 setTimeout(()=>window.print(),100);
}

function tick(){
 if(!unlocked)return;
 let ch=0;const t=today();
 // كل مهمة غير منجزة تنتقل لليوم الحالي دائماً حتى تُنجَز (أيام/أشهر/سنين)
 D.tasks.forEach(k=>{
   if(!k.done&&k.date!==t){
     k.date=t;
     k.roll=(k.roll||0)+1;
     ch=1;
   }
 });
 D.reminders.forEach(r=>{if(!r.done&&!r.n&&evt(r)-r.before*6e4<=Date.now()){r.n=1;ch=1;notifyUser('تذكير: '+r.title,fd(r.date)+' '+ft(r.time));}});
 if(ch){save();if(!document.querySelector('.ov'))draw()}
}
setInterval(tick,3e4);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopVoice()});
let lastAct=Date.now(),hiddenAt=0;
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));

  if(!unlocked)return;
  stopVoice();document.querySelectorAll('.ov,.scanner-ov,.pdfv').forEach(e=>e.remove());
  D=BLANK();loadOk=false;showLock();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)hiddenAt=Date.now();
  else if(unlocked&&hiddenAt&&Date.now()-hiddenAt>120000)lockNow();
});
setInterval(()=>{if(unlocked&&Date.now()-lastAct>600000&&!document.querySelector('.scanner-ov'))lockNow()},30000);
addEyes();
showLock();

(function(){try{const L=document.getElementById('lock');if(!L)return;
const add=()=>{const b=L.querySelector('.box');if(b&&!b.querySelector('.lk')){const i=document.createElement('img');i.className='lk';i.alt='';i.src=document.querySelector('link[rel=icon]').href;b.insertBefore(i,b.firstChild)}};
new MutationObserver(add).observe(L,{childList:true});add()}catch(e){}})();
</script>
</body>
</html>

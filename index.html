<style>

<script>
const K='lawyerAgendaEnc',AUTH='lawyerAuth',$=s=>document.querySelector(s);
let D={tasks:[],deadlines:[],reminders:[],sessions:[],clients:[],scans:[],casePdfs:{},casePages:{}};
let Auth={};try{Auth=JSON.parse(localStorage.getItem(AUTH))||{}}catch(e){}
let cryptoKey=null,unlocked=false,plainPass='',loadOk=false;
const BLANK=()=>({tasks:[],deadlines:[],reminders:[],sessions:[],clients:[],scans:[],casePdfs:{},casePages:{}});
const IMGRE=/^data:image\/(jpeg|png);base64,/;
function normalizeData(d){
  const o=BLANK();if(!d||typeof d!=='object')return o;
  ['tasks','deadlines','reminders','sessions','clients'].forEach(k=>{if(Array.isArray(d[k]))o[k]=d[k].filter(x=>x&&typeof x==='object'&&typeof x.id==='string')});
  if(Array.isArray(d.scans))o.scans=d.scans.filter(x=>x&&typeof x.data==='string'&&IMGRE.test(x.data));
  if(d.casePages&&typeof d.casePages==='object')Object.keys(d.casePages).forEach(k=>{if(k==='__proto__'||k==='constructor'||k==='prototype')return;const a=d.casePages[k];if(Array.isArray(a))o.casePages[k]=a.filter(x=>typeof x==='string'&&IMGRE.test(x))});
  return o;
}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const fd=s=>P(s).toLocaleDateString('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const ft=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' ص':' م')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KINDS=['استئناف','طعن (نقض)','اعتراض','متابعة','أخرى'];
const BEFORE=[[0,'عند الموعد'],[15,'قبل 15 دقيقة'],[60,'قبل ساعة'],[180,'قبل 3 ساعات'],[1440,'قبل يوم'],[2880,'قبل يومين']];
const QUESTIONS=['ما اسم أول مدرسة درست فيها؟','ما اسم مدينتك الأصلية؟','ما لون سيارتك المفضلة؟','ما اسم حيوانك الأليف الأول؟','ما اسم أفضل صديق في الطفولة؟'];

function left(due){const d=diff(today(),due),a=Math.abs(d);
 if(d===0)return'ينتهي اليوم';if(d===1)return'ينتهي غداً';if(d>1)return'متبقي '+d+' يوم';return'فات منذ '+a+' يوم'}
const urg=x=>{if(x.done)return'ok';const d=diff(today(),x.due);return d<0?'red':d<=3?'red':d<=10?'amb':'acc'};
const evt=r=>{const[y,m,d]=r.date.split('-').map(Number),[h,n]=(r.time||'09:00').split(':').map(Number);return new Date(y,m-1,d,h,n)};
const dueRem=()=>D.reminders.filter(r=>!r.done&&evt(r)-r.before*6e4<=Date.now());

/* ---- أمان: تشفير AES-GCM بكلمة المرور ---- */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return (h>>>0).toString(36)+s.length}
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function fromB64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
const ITER=310000;
async function deriveKey(pass,saltB64,iter){
  const it=iter||(saltB64?(Auth.iter||120000):ITER);
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveKey']);
  const salt=saltB64?fromB64(saltB64):crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt instanceof ArrayBuffer?new Uint8Array(salt):salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  return{key,saltB64:saltB64||b64(salt)};
}
async function encryptData(obj,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const enc=new TextEncoder();
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return{v:1,iv:b64(iv),ct:b64(ct)};
}
async function decryptData(pack,key){
  const dec=new TextDecoder();
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(fromB64(pack.iv))},key,fromB64(pack.ct));
  return JSON.parse(dec.decode(pt));
}
async function save(){
  try{
    if(!cryptoKey){if(Auth.pass)return;localStorage.setItem(K,JSON.stringify({plain:1,data:D}));return}
    if(!loadOk)return; // لا نكتب فوق بيانات لم تُقرأ بنجاح
    const pack=await encryptData(D,cryptoKey);
    localStorage.setItem(K,JSON.stringify(pack));
  }catch(e){toast('تعذّر حفظ البيانات المشفّرة')}
}
const saveAuth=()=>{try{localStorage.setItem(AUTH,JSON.stringify(Auth))}catch(e){}};
const mkChk=key=>encryptData({ok:1},key);
async function verifyPass(p){
  try{
    const{key}=await deriveKey(p,Auth.salt);
    if(Auth.chk){await decryptData(Auth.chk,key);return key}
    if(hash(p)!==Auth.pass)return null; // حسابات قديمة: تحقق مرة واحدة ثم نرقّيها
    Auth.chk=await mkChk(key);Auth.pass='1';saveAuth();return key;
  }catch(e){return null}
}
async function loadData(){
  loadOk=false;
  try{

  try{r.node.onaudioprocess=null;r.node.disconnect()}catch(e){}
  try{r.src.disconnect()}catch(e){}
  try{r.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{if(r.ctx.state!=='closed')r.ctx.close()}catch(e){}
}
function whCleanup(){if(whRec){const r=whRec;whRec=null;whStopCapture(r)}}
async function startWhisperVoice(inputEl,btn){
  stopVoice();
  recTarget=inputEl;recActive=true;
  if(btn)btn.classList.add('rec');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true,channelCount:1},video:false});
    if(!(recActive&&recTarget===inputEl)){stream.getTracks().forEach(t=>t.stop());return true}
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')await ctx.resume();
    const src=ctx.createMediaStreamSource(stream);
    const node=ctx.createScriptProcessor(4096,1,1);
    const chunks=[];
    node.onaudioprocess=e=>{chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
    const gain=ctx.createGain();gain.gain.value=0;
    src.connect(node);node.connect(gain);gain.connect(ctx.destination);
    whRec={stream,ctx,src,node,chunks,sr:ctx.sampleRate,inputEl,btn};
    whEnsure().catch(()=>{}); // جهّز المحرك أثناء كلامك
    clearTimeout(recSilence);
    recSilence=setTimeout(()=>{if(whRec)finishWhisper()},90000);
    toast('سجّل كلامك ثم اضغط الميكروفون مرة أخرى للإيقاف والتحويل');
    return true;
  }catch(e){
    stopVoice();
    toast((e&&e.name)==='NotAllowedError'?'الميكروفون محظور: اضغط القفل بجانب العنوان ← الميكروفون ← سماح':'تعذّر تشغيل الميكروفون: '+(e&&e.message||e));
    return true;
  }
}
async function finishWhisper(){
  const r=whRec;if(!r)return;
  whRec=null;clearTimeout(recSilence);
  whStopCapture(r);
  detachVoice();
  const total=r.chunks.reduce((a,c)=>a+c.length,0);
  if(total<r.sr*0.6){toast('التسجيل قصير جداً');return}
  const merged=new Float32Array(total);let o=0;
  for(const c of r.chunks){merged.set(c,o);o+=c.length}
  if(r.btn)r.btn.disabled=true;
  toast('جاري تحويل الكلام إلى نص…');
  try{
    const a16=await whResample(merged,r.sr);
    await whEnsure();
    let text;
    try{text=await whRun(a16.slice())}
    catch(e){
      if(/OrtRun|memory|alloc|abort|error code/i.test(String(e&&e.message))&&whModel()!==WH_TINY){
        toast('الذاكرة لا تكفي للنموذج الحالي — جاري التحويل للنموذج الأخف (تنزيل ~40 ميجا، يلزم إنترنت)…');
        try{localStorage.setItem('lawyerWhisperModel',WH_TINY)}catch(x){}
        whReset();await whEnsure();
        text=await whRun(a16.slice());
      }else throw e;
    }
    if(text){
      const cur=r.inputEl.value||'';
      r.inputEl.value=(cur?cur+' ':'')+text;
      r.inputEl.dispatchEvent(new Event('input',{bubbles:true}));
    }else toast('لم أتبيّن كلاماً، حاول مرة أخرى بصوت أوضح');
  }catch(e){
    toast('فشل التحويل: '+(e&&e.message||e)+(whInstalled()?'':' — ثبّت Whisper من الإعدادات'));
  }finally{if(r.btn)r.btn.disabled=false}
}
function preloadWhisper(){
  if(whReady||whLoading||!whInstalled())return;
  setTimeout(()=>{whEnsure().catch(()=>{})},1200);
}

/* ---- التعرف المدمج بالمتصفح (On-device) — بدون ملفات، خفيف ولحظي ---- */
const OD_LANGS=['ar-SA','ar-EG','ar'];
function odMsg(t){const el=document.getElementById('odStatus');if(el)el.textContent=t}
async function odStatus(){
  if(!SpeechRec||typeof SpeechRec.available!=='function')return{state:'unsupported'};
  let best={state:'unavailable'};
  for(const l of OD_LANGS){
    try{
      const r=await SpeechRec.available({langs:[l],processLocally:true});
      if(r==='available')return{state:'available',lang:l};
      if((r==='downloadable'||r==='downloading')&&best.state==='unavailable')best={state:r,lang:l};
    }catch(e){}
  }
  return best;
}
async function odRefresh(){
  const o=await odStatus();
  odMsg(({
    unsupported:'✗ هذا المتصفح لا يدعم التعرف بدون نت. استخدم Chrome أو Edge حديث (وليس Firefox).',
    unavailable:'✗ العربية بدون نت غير متاحة في هذا المتصفح/الجهاز حالياً.',
    downloadable:'حزمة اللغة العربية غير منزّلة — اضغط «تفعيل» (يحتاج إنترنت مرة واحدة).',
    downloading:'جاري تنزيل حزمة اللغة العربية…',
    available:'✓ جاهز — التعرف العربي يعمل الآن بدون إنترنت'
  })[o.state]);
  return o;
}
async function odEnable(){
  let o=await odRefresh();
  if(o.state==='downloadable'||o.state==='downloading'){
    odMsg('جاري تنزيل حزمة اللغة العربية من المتصفح… (يلزم إنترنت لمرة واحدة)');
    try{await SpeechRec.install({langs:[o.lang],processLocally:true})}catch(e){odMsg('✗ فشل التنزيل: '+(e&&e.message||e));return}
    o=await odRefresh();
    if(o.state==='available')toast('جاهز — الميكروفون يعمل بدون إنترنت');
  }
}
function voskFailed(){try{return localStorage.getItem('lawyerVoskFail')==='1'}catch(e){return false}}
function setVoskFailed(v){try{v?localStorage.setItem('lawyerVoskFail','1'):localStorage.removeItem('lawyerVoskFail')}catch(e){}}

/* ---- حالة Vosk تظهر فوراً في بطاقة الإعدادات ---- */
const IS_HTTP=/^https?:$/.test(location.protocol);
let voskLastMsg='',voskSrcCache=null,voskPreloadTried=false,voskScriptP=null;
function voskMsg(t){voskLastMsg=t;const el=document.getElementById('voskStatus');if(el)el.textContent=t}

/* ---- تحميل سكربت Vosk محلياً (يعمل حتى من file://) ---- */
function loadVoskScript(){
  if(window.Vosk)return Promise.resolve(window.Vosk);
  if(voskScriptP)return voskScriptP;
  voskScriptP=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=VOSK_SCRIPT;
    s.onload=()=>{window.Vosk?resolve(window.Vosk):(voskScriptP=null,reject(new Error('vosk.js حُمّل لكن لم يُعرّف Vosk — تأكد أنه ملف vosk-browser الصحيح')))};
    s.onerror=()=>{voskScriptP=null;reject(new Error('تعذّر تحميل vosk.js — ضعه بجانب index.html'))};
    document.head.appendChild(s);
  });
  return voskScriptP;
}

/* ---- IndexedDB: النموذج يُحفظ داخل المتصفح مرة واحدة ---- */
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('lawyerVosk',1);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('models'))db.createObjectStore('models')};
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function idbGetModel(){
  try{
    const db=await idbOpen();
    return await new Promise((res,rej)=>{
      const q=db.transaction('models','readonly').objectStore('models').get(VOSK_MODEL_ID);
      q.onsuccess=()=>res(q.result||null);
      q.onerror=()=>rej(q.error);
    });
  }catch(e){return null}
}
async function idbPutModel(blob){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction('models','readwrite');
    tx.objectStore('models').put(blob,VOSK_MODEL_ID);
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
    tx.onabort=()=>rej(tx.error||new Error('فشل الحفظ (ربما المساحة ممتلئة)'));
  });
}
async function idbHasModel(){const b=await idbGetModel();return !!(b&&b.size>1e6)}

/* ---- أين النموذج؟ فحص فوري (بدون تحميل) ---- */
async function modelSource(){
  if(voskSrcCache)return voskSrcCache;
  const b=await idbGetModel();
  if(b&&b.size>1e6)return voskSrcCache={kind:'idb',blob:b};
  if(IS_HTTP){ // file:// يمنع fetch، لذلك نجرب فقط عند التشغيل عبر http
    try{const h=await fetch(VOSK_MODEL_LOCAL,{method:'HEAD',cache:'no-cache'});if(h.ok)return voskSrcCache={kind:'http'}}catch(e){}
  }
  return null;
}

/* ---- قراءة أول عنصر من الأرشيف للتأكد من بنيته ---- */
async function peekTar(blob){
  const h=new Uint8Array(await blob.slice(0,2).arrayBuffer());
  if(h[0]!==0x1f||h[1]!==0x8b)return{ok:false,msg:'الملف ليس gzip. يجب أن يكون vosk-ar.tar.gz (وليس .tar أو .zip أو .rar)'};
  if(typeof DecompressionStream==='undefined')return{ok:true,first:''};
  try{
    const rd=blob.slice(0,2*1024*1024).stream().pipeThrough(new DecompressionStream('gzip')).getReader();
    let buf=new Uint8Array(0);
    while(buf.length<512){
      const{value,done}=await rd.read();if(done)break;
      const n=new Uint8Array(buf.length+value.length);n.set(buf);n.set(value,buf.length);buf=n;
    }
    try{rd.cancel()}catch(e){}
    return{ok:true,first:new TextDecoder().decode(buf.slice(0,100)).replace(/\0[\s\S]*$/,'')};
  }catch(e){return{ok:true,first:''}}
}

/* ---- اختيار ملف النموذج مرة واحدة وحفظه في المتصفح ---- */
function pickModelFile(){
  return new Promise(res=>{
    const inp=document.createElement('input');
    inp.type='file';inp.accept='.gz,.tgz,application/gzip,application/x-gzip';inp.style.display='none';
    inp.onchange=()=>{const f=inp.files&&inp.files[0];inp.remove();res(f||null)};
    inp.oncancel=()=>{inp.remove();res(null)};
    document.body.appendChild(inp);inp.click();
  });
}
async function importModelFile(){
  voskMsg('اختر الملف models/vosk-ar.tar.gz من النافذة…');
  const f=await pickModelFile();
  if(!f){voskMsg('✗ لم يتم اختيار ملف');return false}
  if(f.size<20*1024*1024){voskMsg('✗ الملف صغير جداً ('+Math.round(f.size/1048576)+' MB) — اختر vosk-ar.tar.gz الكامل');return false}
  const pk=await peekTar(f);
  if(!pk.ok){voskMsg('✗ '+pk.msg);return false}
  voskMsg('جاري حفظ النموذج داخل المتصفح (مرة واحدة)…');
  try{await idbPutModel(f)}catch(e){voskMsg('✗ فشل الحفظ: '+(e&&e.message||e));return false}
  voskSrcCache=null;setVoskFailed(false);
  if(voskModel){try{voskModel.terminate&&voskModel.terminate()}catch(e){}voskModel=null;voskReady=false}
  voskMsg('✓ تم حفظ النموذج ('+Math.round(f.size/1048576)+' MB)'+(pk.first?' — أول عنصر في الأرشيف: '+pk.first:''));
  return true;
}

/* ---- تحميل النموذج في الذاكرة (مرة واحدة لكل تشغيل) ---- */
async function ensureVoskModel(onStatus){
  if(voskModel)return voskModel;
  if(voskLoading)return voskLoading;
  voskLoading=(async()=>{
    const src=await modelSource();
    if(!src)return null;
    await loadVoskScript();
    let url=VOSK_MODEL_LOCAL,revoke=null;
    if(src.kind==='idb'){url=URL.createObjectURL(src.blob);revoke=url}
    const t0=Date.now();
    const tick=setInterval(()=>{if(onStatus)onStatus('جاري تهيئة المحرك… '+Math.round((Date.now()-t0)/1000)+' ث (مرة واحدة عند كل تشغيل)')},500);
    try{
      const m=await Promise.race([
        window.Vosk.createModel(url),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('انتهت المهلة (5 دقائق) — الجهاز لا يتحمل هذا النموذج الكبير')),300000))
      ]);
      voskModel=m;voskReady=true;setVoskFailed(false);
      voskMsg('✓ التعرف العربي المحلي جاهز — يعمل بدون إنترنت');
      return m;
    }catch(err){setVoskFailed(true);throw err}
    finally{clearInterval(tick);if(revoke)URL.revokeObjectURL(revoke)}
  })();
  try{return await voskLoading}finally{voskLoading=null}
}

/* ---- زر «فحص النموذج»: فحص فوري ثم تهيئة ---- */
async function voskCheck(forcePick){
  let src=forcePick?null:await modelSource();
  if(!src){ // أول مرة: اختر الملف
    if(!(await importModelFile()))return;
    src=await modelSource();if(!src)return;
  }
  if(voskModel){voskMsg('✓ التعرف العربي المحلي جاهز — يعمل بدون إنترنت');toast('Vosk جاهز');return}
  try{await loadVoskScript()}catch(e){voskMsg('✗ '+e.message);toast(e.message);return}
  if(voskLoading){voskMsg('جاري تهيئة المحرك…');return}
  voskMsg('✓ النموذج موجود — جاري تهيئة المحرك…');
  try{
    const m=await ensureVoskModel(voskMsg);
    if(m)toast('Vosk جاهز — اضغط الميكروفون وتكلم');
    else voskMsg('✗ النموذج غير موجود');
  }catch(e){
    voskMsg('✗ فشل تحميل النموذج: '+(e&&e.message||e)+' — تأكد أن الأرشيف بصيغة tar.gz وبداخله am و conf و graph');
  }
}
/* حالة فورية عند فتح الإعدادات */
async function voskStatusRefresh(){
  if(voskModel){voskMsg('✓ التعرف العربي المحلي جاهز — يعمل بدون إنترنت');return}
  if(voskLoading){voskMsg(voskLastMsg||'جاري تهيئة المحرك…');return}
  const src=await modelSource();
  voskMsg(src?'✓ النموذج محفوظ ('+(src.kind==='idb'?'داخل المتصفح':'ملف محلي')+') — اضغط «فحص النموذج» لتهيئته':'✗ النموذج غير مثبت — اضغط «اختيار ملف النموذج» وحدد models/vosk-ar.tar.gz');
}
/* تحميل مسبق صامت بعد فتح التطبيق ليكون الميكروفون فورياً */
function preloadVosk(){
  if(voskPreloadTried||voskModel||voskLoading||voskFailed())return;
  voskPreloadTried=true;
  setTimeout(async()=>{
    try{if(await modelSource())await ensureVoskModel(voskMsg)}catch(e){voskMsg('✗ فشل التحميل المسبق: '+(e&&e.message||e))}
  },1500);
}

async function startVoskVoice(inputEl,btn){
  stopVoice();
  recTarget=inputEl;recActive=true;
  recBase=(inputEl&&inputEl.value)||'';recCommit='';voskPartial='';
  if(btn)btn.classList.add('rec');
  const cancelled=()=>!(recActive&&recTarget===inputEl);
  // اطلب الميكروفون بالتوازي مع تحميل النموذج لتوفير الوقت
  const streamP=navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true,channelCount:1},video:false
  });
  streamP.catch(()=>{});
  let model=voskModel;
  if(!model){
    toast('جاري تجهيز النموذج… ثوانٍ فقط');
    try{model=await ensureVoskModel(voskMsg)}
    catch(e){stopVoice();toast('فشل تحميل النموذج: '+(e&&e.message||e));return true}
    if(cancelled()){try{(await streamP).getTracks().forEach(t=>t.stop())}catch(e){}return true}
    if(!model){stopVoice();return false}
  }
  try{
    voskStream=await streamP;
    if(cancelled()){voskStream.getTracks().forEach(t=>t.stop());voskStream=null;return true}
    voskCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(voskCtx.state==='suspended')await voskCtx.resume();
    voskRec=new model.KaldiRecognizer(voskCtx.sampleRate);
    voskRec.setWords&&voskRec.setWords(false);

    const arm=()=>{
      clearTimeout(recSilence);
      recSilence=setTimeout(()=>{if(recActive){stopVoice();toast('تم إيقاف الإدخال بعد توقفك عن الكلام')}},12000);
    };
    const write=()=>{
      if(!recTarget)return;
      recTarget.value=(recBase?recBase+' ':'')+recCommit+(voskPartial?(recCommit?' ':'')+voskPartial:'');
      recTarget.dispatchEvent(new Event('input',{bubbles:true}));
    };
    voskRec.on('result',msg=>{
      const t=(msg&&msg.result&&msg.result.text||'').trim();
      if(t){recCommit+=(recCommit?' ':'')+t;arm()}
      voskPartial='';write();
    });
    voskRec.on('partialresult',msg=>{
      const p=(msg&&msg.result&&msg.result.partial||'').trim();
      if(p!==voskPartial){voskPartial=p;if(p)arm();write()}
    });
    voskRec.on('error',msg=>{toast('خطأ في التعرف: '+(msg&&msg.error||''));});

    voskSource=voskCtx.createMediaStreamSource(voskStream);
    voskNode=voskCtx.createScriptProcessor(4096,1,1);
    voskNode.onaudioprocess=e=>{try{if(voskRec)voskRec.acceptWaveform(e.inputBuffer)}catch(err){}};
    const gain=voskCtx.createGain();gain.gain.value=0; // كتم الخرج لمنع الصدى
    voskSource.connect(voskNode);
    voskNode.connect(gain);gain.connect(voskCtx.destination);
    arm();
    toast('تكلم الآن… (بدون إنترنت)');
    return true;
  }catch(e){
    stopVoice();
    const n=e&&e.name;
    toast(n==='NotAllowedError'?'الميكروفون محظور: اضغط أيقونة القفل بجانب العنوان ← الميكروفون ← سماح':'تعذّر تشغيل الميكروفون أو Vosk: '+(e&&e.message||e));
    return true;
  }
}

async function startVoice(inputEl,btn){
  if(whRec&&whRec.inputEl===inputEl){finishWhisper();return}
  if(recActive&&recTarget===inputEl){
    stopVoice();
    toast('تم إيقاف الإدخال الصوتي');
    return;
  }

  // أولوية: Vosk المحلي (فحص فوري بدون تحميل)
  if(whInstalled()||whReady){
    const okW=await startWhisperVoice(inputEl,btn);
    if(okW)return;
  }
  let od={state:'unsupported'};
  try{od=await odStatus()}catch(e){}
  const useLocal=od.state==='available';
  if(voskModel||(!useLocal&&!voskFailed()&&(voskLoading||await modelSource()))){
    const ok=await startVoskVoice(inputEl,btn);
    if(ok)return;
  }

  // إن لم يتوفر Vosk: استخدم Web Speech عند وجود نت
  if(!SpeechRec){
    toast('ثبّت نموذج Vosk من الإعدادات لتعمل بدون نت، أو استخدم Chrome مع إنترنت.');
    return;
  }
  if(navigator.onLine===false&&!useLocal){
    toast('لا يوجد إنترنت. من الإعدادات اضغط «تنزيل وتفعيل» في بطاقة Whisper (مرة واحدة وأنت متصل).');
    return;
  }

  stopVoice();
  recTarget=inputEl;
  recActive=true;
  recBase=(inputEl&&inputEl.value)||'';
  recCommit='';
  if(btn)btn.classList.add('rec');

  const r=new SpeechRec();
  recognition=r;
  try{r.processLocally=useLocal}catch(e){}
  r.lang=useLocal?od.lang:'ar-SA';
  r.continuous=true;
  r.interimResults=true;
  r.maxAlternatives=1;
  let lastIdx=0;
  const tried=['ar-SA','ar-EG','ar'];
  let li=0;
  const arm=()=>{
    clearTimeout(recSilence);
    recSilence=setTimeout(()=>{if(recognition===r){stopVoice();toast('تم إيقاف الإدخال بعد توقفك عن الكلام')}},8000);
  };
  r.onstart=()=>{arm();toast(useLocal?'تكلم الآن… (بدون إنترنت)':'تكلم الآن… (وضع الإنترنت — ثبّت Whisper من الإعدادات)')};
  r.onresult=e=>{
    arm();
    let interim='';
    for(let i=lastIdx;i<e.results.length;i++){
      const x=e.results[i];
      if(x.isFinal){
        const t=x[0].transcript.trim();
        if(t)recCommit+=(recCommit?' ':'')+t;
        lastIdx=i+1;
      }else interim+=x[0].transcript;
    }
    if(recTarget){
      recTarget.value=(recBase?recBase+' ':'')+recCommit+(interim?(recCommit?' ':'')+interim:'');
      recTarget.dispatchEvent(new Event('input',{bubbles:true}));
    }
  };
  r.onerror=e=>{
    if(e.error==='no-speech'||e.error==='aborted'){if(recognition===r)stopVoice();return}
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      toast('الميكروفون محظور. من شريط العنوان: القفل ← الميكروفون ← سماح');
    }else if(e.error==='language-not-supported'&&li<tried.length-1){

const BK_B='%%LAWYERBACKUP-BEGIN%%',BK_E='%%LAWYERBACKUP-END%%';

    sec('الموكلون',D.clients,r=>J([r.name,r.phone]));
  }
  const W=1240,H=1754,M=70,pages=[];let c,x,y;
  const fnt=t=>(t==='t'?'700 42px':t==='h'?'700 30px':t==='n'?'400 21px':'400 25px')+' "Segoe UI",Tahoma,Arial,sans-serif';
  const np=()=>{c=document.createElement('canvas');c.width=W;c.height=H;x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#222';x.direction='rtl';x.textAlign='right';y=M;pages.push(c)};
  np();
  for(const b of B){
    x.font=fnt(b.t);const lh=b.t==='t'?64:b.t==='h'?56:b.t==='n'?30:36;
    if(b.t==='h'){y+=14;x.fillStyle='#4a2f1a'}else x.fillStyle=b.t==='n'?'#666':'#222';

      x.fillText(ln,W-M,y+lh*0.78);y+=lh;

  }

}

async function restoreFile(f){
  const im=$('#im');const say=m=>{if(im)im.textContent=m;toast(m,4500)};
  try{
    let j;
    if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
      const txt=new TextDecoder('latin1').decode(await f.arrayBuffer());
      const a=txt.indexOf(BK_B),b=txt.indexOf(BK_E,a);
      if(a<0||b<0){say('هذا الملف ليس نسخة احتياطية من التطبيق (أو أُعيد حفظه من برنامج آخر)');return}
      j=JSON.parse(txt.slice(a+BK_B.length,b));
    }else j=JSON.parse(await f.text());
    let data;
    if(j&&j.v===2&&j.pack&&j.salt){
      const pw=await askPass('كلمة مرور النسخة','أدخل كلمة المرور التي كانت مستخدمة وقت أخذ هذه النسخة.');
      if(pw===null)return;
      const{key}=await deriveKey(pw,j.salt,+j.iter||120000);
      try{data=await decryptData(j.pack,key)}catch(e){say('كلمة المرور غير صحيحة أو الملف تالف');return}
    }else if(j&&j.plain&&j.data)data=j.data;
    else if(j&&j.ct&&j.iv){
      try{data=await decryptData(j,cryptoKey)}catch(e){say('هذه نسخة JSON قديمة ولا تُفتح إلا على نفس الجهاز بنفس كلمة المرور. أنشئ نسخة PDF جديدة.');return}
    }else{say('ملف غير صالح');return}
    const nd=normalizeData(data);
    if(!confirm('سيتم استبدال البيانات الحالية ببيانات النسخة ('+nd.sessions.length+' جلسة، '+nd.deadlines.length+' موعد طعن، '+nd.tasks.length+' مهمة). متابعة؟'))return;
    D=nd;loadOk=true;await save();draw();
    say('تمت الاستعادة بنجاح');
  }catch(e){console.warn(e);say('ملف غير صالح')}
}

function compressImage(file,maxW,quality){


  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=rej;
      img.src=r.result;
    };
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
/* توليد PDF بسيط يضم صوراً (بدون مكتبات خارجية) */
function jpegToPdf(images,title){
  // كل صورة = صفحة؛ PDF يدوي مبسّط لـ JPEG
  const pages=[];
  const encoder=new TextEncoder();
  function str(s){return s}
  let objs=[],xref=[],body='',o=1;
  function addObj(content){
    const off=body.length;
    xref.push(off);
    body+=`${o} 0 obj\n${content}\nendobj\n`;
    return o++;
  }
  // Catalog + Pages later
  const imgIds=[],pageIds=[];
  for(const src of images){
    const b64s=src.replace(/^data:image\/jpeg;base64,/,'').replace(/^data:image\/jpg;base64,/,'');
    // decode base64 to binary string for length
    const bin=atob(b64s);
    // Get dimensions roughly from JPEG SOF — default A4-ish
    let w=595,h=842;
    try{
      const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      for(let i=0;i<u.length-9;i++){
        if(u[i]===0xFF&&(u[i+1]===0xC0||u[i+1]===0xC2)){
          h=(u[i+5]<<8)|u[i+6];w=(u[i+7]<<8)|u[i+8];break;
        }
      }
    }catch(e){}
    // scale to fit A4 595x842
    const maxW=555,maxH=800;
    let dw=w,dh=h;
    const sc=Math.min(maxW/w,maxH/h,1);
    dw=Math.round(w*sc);dh=Math.round(h*sc);
    const x=Math.round((595-dw)/2),y=Math.round((842-dh)/2);
    const imgObj=addObj(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n${bin}\nendstream`);
    imgIds.push(imgObj);
    const cont=addObj(`<< /Length ${`q ${dw} 0 0 ${dh} ${x} ${y} cm /Im${imgObj} Do Q`.length} >>\nstream\nq ${dw} 0 0 ${dh} ${x} ${y} cm /Im${imgObj} Do Q\nendstream`);
    const page=addObj(`<< /Type /Page /Parent PAGES /MediaBox [0 0 595 842] /Contents ${cont} 0 R /Resources << /XObject << /Im${imgObj} ${imgObj} 0 R >> >> >>`);
    pageIds.push(page);
  }
  const pagesObj=o;
  body+=`${o} 0 obj\n<< /Type /Pages /Kids [${pageIds.map(id=>id+' 0 R').join(' ')}] /Count ${pageIds.length} >>\nendobj\n`;
  xref.push(body.length-(body.split('\n').slice(-3).join('\n').length)); // rough, fix below
  // rebuild properly
  return buildPdf(images,title);
}

  // object 2: pages (kids filled later conceptually — we know ids)

  const pageRefs=[];
  const imgBinaries=[];
  for(let i=0;i<n;i++){
    const src=images[i];
    let b64s=src;
    if(b64s.startsWith('data:'))b64s=b64s.split(',')[1];
    const bin=atob(b64s);
    let w=595,h=842;
    try{
      const u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);
      for(let j=0;j<u.length-9;j++){
        if(u[j]===0xFF&&(u[j+1]===0xC0||u[j+1]===0xC2)){h=(u[j+5]<<8)|u[j+6];w=(u[j+7]<<8)|u[j+8];break}
      }
    }catch(e){}
    const maxW=555,maxH=800;
    const sc=Math.min(maxW/w,maxH/h,1);
    const dw=Math.round(w*sc),dh=Math.round(h*sc);
    const x=Math.round((595-dw)/2),y=Math.round((842-dh)/2);
    const imgId=next++,contId=next++,pageId=next++;
    pageRefs.push(pageId);
    imgBinaries.push({imgId,contId,pageId,bin,w,h,dw,dh,x,y});
  }
  obj(2,`<< /Type /Pages /Kids [${pageRefs.map(id=>id+' 0 R').join(' ')}] /Count ${n} >>`);
  for(const im of imgBinaries){
    offsets[im.imgId]=pdf.length;
    pdf+=`${im.imgId} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bin.length} >>\nstream\n`;
    pdf+=im.bin;
    pdf+=`\nendstream\nendobj\n`;
    const stream=`q ${im.dw} 0 0 ${im.dh} ${im.x} ${im.y} cm /Im0 Do Q`;
    obj(im.contId,`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    obj(im.pageId,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents ${im.contId} 0 R /Resources << /XObject << /Im0 ${im.imgId} 0 R >> >> >>`);
  }
  if(extra){obj(next,`<< /Length ${extra.length} >>\nstream\n${extra}\nendstream`);next++}
  const xrefStart=pdf.length;
  pdf+='xref\n';
  pdf+=`0 ${next}\n`;
  pdf+='0000000000 65535 f \n';
  for(let i=1;i<next;i++){
    const off=String(offsets[i]||0).padStart(10,'0');
    pdf+=`${off} 00000 n \n`;
  }
  pdf+=`trailer\n<< /Size ${next} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  // Convert to Blob — binary string to Uint8Array
  const len=pdf.length;
  const u8=new Uint8Array(len);
  for(let i=0;i<len;i++)u8[i]=pdf.charCodeAt(i)&0xff;
  return new Blob([u8],{type:'application/pdf'});
}

const dlMini=x=>{const u=urg(x);return`<div class="card ${u}"><div class="row sp"><span class="tag">${esc(x.kind)}</span><span class="tag ${u==='red'?'red':''}">${left(x.due)}</span></div><h3 style="margin-top:6px">${esc(x.title||x.client)}</h3>${line('آخر موعد: '+fd(x.due))}</div>`};
V.dashboard=()=>{const t=today(),we=add(t,7),S=D.sessions,ts=S.filter(x=>x.date===t).sort(byT),up=S.filter(x=>x.date>t&&x.date<=we&&!x.done).sort(byT),od=S.filter(x=>x.date<t&&!x.done),tk=D.tasks.filter(x=>x.date===t).sort((a,b)=>a.done-b.done),nd=D.deadlines.filter(x=>!x.done&&diff(t,x.due)<=10).sort((a,b)=>a.due.localeCompare(b.due)),nr=D.reminders.filter(x=>!x.done&&x.date>=t&&x.date<=we).length;
 const st=[['جلسات اليوم',ts.length,ts.filter(x=>!x.done).length+' متبقية'],['القضايا النشطة',new Set(S.filter(x=>!x.done).map(x=>x.case||x.client)).size,'قيد المتابعة'],['هذا الأسبوع',up.length,'جلسات قادمة'],['مهام اليوم',tk.length,tk.filter(x=>x.done).length+' منجزة'],['مدد الطعن القريبة',nd.length,'خلال 10 أيام أو فائتة'],['تذكيرات الأسبوع',nr,'مواعيد قادمة']];

 })();
 return`<section class="hero"><p>${fd(t)}</p><h1>${ts.length?'لديك '+ts.length+(ts.length===1?' جلسة':' جلسات')+' اليوم':'لا توجد جلسات اليوم'}</h1><p>${heroSub}</p><button class="btn a" style="margin-top:14px" data-a="new" data-t="sessions">+ إضافة جلسة</button></section>

 ${od.length?`<div class="alert red" style="margin-top:14px" role="alert">${od.length} جلسة سابقة تحتاج تحديث <button class="btn s" data-tab="sessions">عرض</button></div>`:''}
 <div class="g"><div><h2>مواعيد الطعن</h2>${nd.length?nd.slice(0,3).map(dlMini).join(''):'<p class="m">لا توجد مدد قريبة.</p>'}</div>

 if(!unlocked)return;
 let ch=0;const t=today();
 // كل مهمة غير منجزة تنتقل لليوم الحالي دائماً حتى تُنجَز (أيام/أشهر/سنين)
 D.tasks.forEach(k=>{
   if(!k.done&&k.date!==t){
     k.date=t;
     k.roll=(k.roll||0)+1;
     ch=1;
   }
 });
 D.reminders.forEach(r=>{if(!r.done&&!r.n&&evt(r)-r.before*6e4<=Date.now()){r.n=1;ch=1;notifyUser('تذكير: '+r.title,fd(r.date)+' '+ft(r.time));}});
 if(ch){save();if(!document.querySelector('.ov'))draw()}
}
setInterval(tick,3e4);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopVoice()});
let lastAct=Date.now(),hiddenAt=0;
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
function lockNow(){
  if(!unlocked)return;
  stopVoice();document.querySelectorAll('.ov,.scanner-ov,.pdfv').forEach(e=>e.remove());
  D=BLANK();loadOk=false;showLock();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)hiddenAt=Date.now();
  else if(unlocked&&hiddenAt&&Date.now()-hiddenAt>120000)lockNow();
});
setInterval(()=>{if(unlocked&&Date.now()-lastAct>600000&&!document.querySelector('.scanner-ov'))lockNow()},30000);
addEyes();
showLock();
</script>
</body>
</html>
